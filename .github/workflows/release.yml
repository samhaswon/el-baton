name: Release Publish

on:
  push:
    tags:
      - "v*"
      - "!v*-nightly*"

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test native packages
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download native packages
        uses: actions/download-artifact@v8
        with:
          pattern: el-baton-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * | sort --key=2 > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "${TAG_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --generate-notes
