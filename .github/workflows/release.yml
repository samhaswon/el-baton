name: Release Publish

on:
  push:
    tags:
      - "v*"
      - "!v*-nightly*"

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test native packages
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download native packages
        uses: actions/download-artifact@v8
        with:
          pattern: el-baton-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          mapfile -d '' assets < <(
            find . -maxdepth 1 -type f -print0 \
              | sort --zero-terminated
          )
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(
            find release-assets -maxdepth 1 -type f -print0 \
              | sort --zero-terminated
          )
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release create "${TAG_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --generate-notes
