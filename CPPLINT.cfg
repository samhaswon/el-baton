set noparent

# clang-format is authoritative for layout and include grouping. The project
# uses C++20 and exposes src/ as an include root, so these Google-style checks
# do not describe this codebase.
filter=-legal/copyright,-build/include_order,-build/c++11,-whitespace/indent,-whitespace/comments,-build/include_subdir

# Do not lint vendored, retained-reference, generated, or build-tree sources.
exclude_files=^(build|cmake|reference|third_party)$
